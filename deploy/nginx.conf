# Sitio "Our Story" - modo HTTP por IP por ahora.
# Cuando compres un dominio, cambia `server_name _` por tu dominio,
# ejecuta certbot y deja que genere el bloque 443 automáticamente.
server {
    listen 80;
    server_name _;

    root /var/www/our-story;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API (proxy a Docker; solo Nginx la expone al público)
    location /api/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash (build de Vite): caché larga
    location ~* \.(?:css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: caída a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}