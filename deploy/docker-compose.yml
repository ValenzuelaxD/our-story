services:
  mysql:
    image: mysql:5.7
    container_name: our-story-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - ../api/.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: ../api
    image: our-story-api:latest
    container_name: our-story-api
    restart: always
    env_file:
      - ../api/.env
    ports:
      - "127.0.0.1:7000:7000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: