name: Deploy API (SSH)

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'deploy/**'
      - '.github/workflows/api-ci-cd.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar API en el VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          APPROVE_SECRET: ${{ secrets.APPROVE_SECRET }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
          GITHUB_REPO: ${{ secrets.REPO_SLUG }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MAIL_NOME_ELE: ${{ secrets.MAIL_NOME_ELE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: TURNSTILE_SECRET_KEY,MAIL_SERVER,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM,MAIL_TO,APPROVE_SECRET,API_BASE_URL,ALLOWED_ORIGINS,ADMIN_TOKEN,GITHUB_TOKEN,GITHUB_REPO,DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,MAIL_NOME_ELE
          script: |
            set -eu
            cd /opt/our-story
            git pull --ff-only
            umask 077
            {
              printf '%s\n' "NODE_ENV=production"
              printf '%s\n' "PORT=7000"
              printf '%s\n' "TRUST_PROXY=1"
              printf '%s\n' "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY"
              printf '%s\n' "MAIL_SERVER=$MAIL_SERVER"
              printf '%s\n' "MAIL_PORT=$MAIL_PORT"
              printf '%s\n' "MAIL_USERNAME=$MAIL_USERNAME"
              printf '%s\n' "MAIL_PASSWORD=$MAIL_PASSWORD"
              printf '%s\n' "MAIL_FROM=${MAIL_FROM:-$MAIL_USERNAME}"
              printf '%s\n' "MAIL_TO=${MAIL_TO:-$MAIL_USERNAME}"
              printf '%s\n' "ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://66.179.211.195}"
              [ -n "${APPROVE_SECRET:-}" ] && printf '%s\n' "APPROVE_SECRET=$APPROVE_SECRET"
              [ -n "${API_BASE_URL:-}" ]    && printf '%s\n' "API_BASE_URL=$API_BASE_URL"
              [ -n "${MAIL_NOME_ELE:-}" ]   && printf '%s\n' "MAIL_NOME_ELE=$MAIL_NOME_ELE"
              [ -n "${ADMIN_TOKEN:-}" ]     && printf '%s\n' "ADMIN_TOKEN=$ADMIN_TOKEN"
              [ -n "${GITHUB_TOKEN:-}" ]    && printf '%s\n' "GITHUB_TOKEN=$GITHUB_TOKEN"
              [ -n "${GITHUB_REPO:-}" ]     && printf '%s\n' "GITHUB_REPO=$GITHUB_REPO"
              [ -n "${DB_HOST:-}" ]         && printf '%s\n' "DB_HOST=$DB_HOST"
              [ -n "${DB_PORT:-}" ]         && printf '%s\n' "DB_PORT=$DB_PORT"
              [ -n "${DB_USER:-}" ]         && printf '%s\n' "DB_USER=$DB_USER"
              [ -n "${DB_PASSWORD:-}" ]     && printf '%s\n' "DB_PASSWORD=$DB_PASSWORD"
              [ -n "${DB_NAME:-}" ]         && printf '%s\n' "DB_NAME=$DB_NAME"
              [ -n "${MYSQL_ROOT_PASSWORD:-}" ] && printf '%s\n' "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD"
              [ -n "${MYSQL_DATABASE:-}" ]  && printf '%s\n' "MYSQL_DATABASE=$MYSQL_DATABASE"
              [ -n "${MYSQL_USER:-}" ]      && printf '%s\n' "MYSQL_USER=$MYSQL_USER"
              [ -n "${MYSQL_PASSWORD:-}" ]  && printf '%s\n' "MYSQL_PASSWORD=$MYSQL_PASSWORD"
            } > api/.env
            chmod 600 api/.env
            bash deploy/update-api.sh